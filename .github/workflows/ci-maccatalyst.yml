name: CI maccatalyst

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - run: dotnet workload install android ios maccatalyst --skip-manifest-update
      - run: dotnet restore src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj -p:TeacupsStoreTargetFramework=net10.0-maccatalyst -p:RestoreLockedMode=true
      - run: dotnet build src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj --no-restore -c Release -m:1 -p:TeacupsStoreTargetFramework=net10.0-maccatalyst
      - name: Verify full release dependency graph
        run: dotnet restore Okisioli.Teacups.slnx -p:RestoreLockedMode=true -m:1
      - name: Build all release targets
        run: dotnet build Okisioli.Teacups.slnx --no-restore -c Release -m:1
      - name: Verify release packages
        run: dotnet pack Okisioli.Teacups.slnx --no-build -c Release -m:1
      - uses: actions/upload-artifact@v4
        with:
          name: teacups-packages
          path: publish/*.nupkg
