name: CI maccatalyst

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet workload install maccatalyst --skip-manifest-update
      - run: dotnet restore src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj -p:TeacupsStoreTargetFramework=net10.0-maccatalyst -p:RestoreLockedMode=true
      - run: dotnet build src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj --no-restore -c Release -m:1 -p:TeacupsStoreTargetFramework=net10.0-maccatalyst
