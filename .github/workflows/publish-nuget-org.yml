name: Publish to NuGet.org

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Okisioli.Teacups.slnx

      - name: Build
        run: dotnet build Okisioli.Teacups.slnx --configuration Release --no-restore

      - name: Pack
        run: dotnet pack Okisioli.Teacups.slnx --configuration Release --no-build -o publish

      - name: Publish to NuGet.org
        shell: bash
        run: |
          shopt -s nullglob
          packages=(publish/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No packages were produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ secrets.NUGET_API_KEY }}"
          done
