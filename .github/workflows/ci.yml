name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover-projects:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.discover.outputs.projects }}

    steps:
      - uses: actions/checkout@v4

      - id: discover
        name: Discover workload-free projects
        shell: pwsh
        run: |
          [xml] $solution = Get-Content Okisioli.Teacups.slnx
          $projects = @(
            $solution.SelectNodes('//Project').Path |
              Where-Object { $_ -notmatch '[/\\]Okisioli\.Teacups\.Store\.[^/\\]+[/\\]' } |
              Sort-Object
          )
          "projects=$($projects | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT

  build-and-test:
    needs: discover-projects
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore "${{ matrix.project }}" -p:RestoreLockedMode=true
      - run: dotnet build "${{ matrix.project }}" --no-restore -c Release -m:1
      - run: dotnet test "${{ matrix.project }}" --no-build -c Release -m:1
