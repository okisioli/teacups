name: Publish to NuGet.org

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Okisioli.Teacups.slnx

      - name: Build
        run: dotnet build Okisioli.Teacups.slnx --configuration Release --no-restore -m:1

      - name: Pack
        run: dotnet pack Okisioli.Teacups.slnx --configuration Release --no-build -o publish

      - name: Authenticate to NuGet
        uses: NuGet/login@v1
        id: login
        with:
          user: oli.G
      - name: Publish to NuGet.org
        shell: bash
        run: |
          shopt -s nullglob
          packages=(publish/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "No packages were produced."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://api.nuget.org/v3/index.json" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done
