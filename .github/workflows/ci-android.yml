name: CI android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet workload install android --skip-manifest-update
      - run: dotnet restore src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj -p:TargetFrameworks=net10.0-android -p:RestoreLockedMode=true
      - run: dotnet build src/Okisioli.Teacups.Store.Maui/Okisioli.Teacups.Store.Maui.csproj --no-restore -c Release -m:1 -p:TargetFrameworks=net10.0-android
